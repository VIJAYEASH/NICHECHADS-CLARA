<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLARA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 410px;
            min-height: 620px;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 50% -20%, #183b55 0%, transparent 45%),
                #050a12;
            color: #f8fafc;
        }

        .app {
            padding: 20px;
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            border-radius: 14px;
        }

        .brand-name {
            font-size: 25px;
            font-weight: 850;
            letter-spacing: .5px;
        }

        .brand-sub {
            margin-top: 2px;
            color: #22d3ee;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .3px;
            text-transform: lowercase;
        }

        .active {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 20px;
            color: #4ade80;
            font-size: 10px;
            font-weight: 700;
            background: rgba(34, 197, 94, .06);
        }

        .active-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        /* MAIN */

        .main-card {
            padding: 20px;
            border-radius: 23px;
            background: linear-gradient(
                145deg,
                #0b1828,
                #07101d
            );
            border: 1px solid rgba(34, 211, 238, .14);
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
        }

        /* STATUS */

        .status-section {
            display: grid;
            grid-template-columns: 1fr 150px;
            align-items: center;
            gap: 10px;
            padding: 5px 0 20px;
        }

        .status-left {
            text-align: center;
        }

        .status-icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 43px;
            background: rgba(34, 197, 94, .12);
            border: 3px solid #22c55e;
            box-shadow: 0 0 30px rgba(34,197,94,.22);
        }

        .status {
            font-size: 25px;
            font-weight: 850;
            color: #4ade80;
        }

        .status-description {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 10px;
        }

        /* RISK RING */

        .risk-ring {
            width: 135px;
            height: 135px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                conic-gradient(
                    #4ade80 0deg,
                    #4ade80 36deg,
                    #1e293b 36deg,
                    #1e293b 360deg
                );
            position: relative;
        }

        .risk-ring::after {
            content: "";
            position: absolute;
            width: 111px;
            height: 111px;
            border-radius: 50%;
            background: #091321;
        }

        .risk-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .risk-number {
            font-size: 29px;
            font-weight: 850;
        }

        .risk-label {
            margin-top: 3px;
            color: #64748b;
            font-size: 9px;
            letter-spacing: .7px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-top: 1px solid rgba(148,163,184,.12);
            padding-top: 15px;
            margin-top: 5px;
            gap: 7px;
        }

        .stat {
            text-align: center;
        }

        .stat:not(:last-child) {
            border-right: 1px solid rgba(148,163,184,.1);
        }

        .stat-label {
            color: #64748b;
            font-size: 9px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 750;
        }

        /* WEBSITE */

        .website-card {
            margin-top: 15px;
            padding: 13px;
            border-radius: 15px;
            background: #050c17;
            border: 1px solid rgba(34,211,238,.12);
        }

        .website-title {
            color: #22d3ee;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .website-url {
            color: #cbd5e1;
            font-size: 11px;
            line-height: 17px;
            word-break: break-all;
        }

        /* REASONS */

        .reason-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 9px;
            color: #22d3ee;
            font-size: 14px;
            font-weight: 800;
        }

        .reason-box {
            padding: 12px;
            border-radius: 15px;
            background: rgba(5,12,23,.75);
            border: 1px solid rgba(34,211,238,.12);
        }

        .reason {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            padding: 6px 0;
            color: #cbd5e1;
            font-size: 10px;
            line-height: 15px;
        }

        .reason-icon {
            flex-shrink: 0;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #22c55e;
            color: #03100a;
            font-size: 10px;
            font-weight: bold;
        }

        /* BUTTON */

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(
                90deg,
                #06b6d4,
                #6366f1,
                #d946ef
            );
            box-shadow: 0 10px 28px rgba(99,102,241,.25);
        }

        button:hover {
            transform: translateY(-1px);
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 13px;
            color: #64748b;
            font-size: 8px;
        }

    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="brand">

            <img
                src="clara-logo.png"
                class="logo"
                alt="CLARA"
            >

            <div>
                <div class="brand-name">CLARA</div>
                <div class="brand-sub">
                    signal cathedral
                </div>
            </div>

        </div>

        <div class="active">
            <span class="active-dot"></span>
            ACTIVE
        </div>

    </div>


    <div class="main-card">

        <div class="status-section">

            <div class="status-left">

                <div class="status-icon" id="icon">
                    ✓
                </div>

                <div class="status" id="verdict">
                    Checking...
                </div>

                <div class="status-description" id="statusDescription">
                    Analysing website security
                </div>

            </div>


            <div
                class="risk-ring"
                id="riskRing"
            >

                <div class="risk-content">

                    <div
                        class="risk-number"
                        id="score"
                    >
                        --
                    </div>

                    <div class="risk-label">
                        RISK SCORE
                    </div>

                </div>

            </div>

        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    AI SCORE
                </div>

                <div
                    class="stat-value"
                    id="ml"
                >
                    --
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    SECURITY
                </div>

                <div
                    class="stat-value"
                    id="security"
                >
                    --
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    LAST CHECKED
                </div>

                <div
                    class="stat-value"
                    id="lastChecked"
                >
                    Just now
                </div>

            </div>

        </div>


        <div class="website-card">

            <div class="website-title">
                CURRENT WEBSITE
            </div>

            <div
                class="website-url"
                id="url"
            >
                Reading current website...
            </div>

        </div>


        <div class="reason-title">
            🛡️
            <span>CLARA EXPLAIN</span>
        </div>


        <div
            class="reason-box"
            id="reasons"
        >
            <div class="reason">
                <span class="reason-icon">✓</span>
                <span>Analysing website security...</span>
            </div>
        </div>


        <button id="scanBtn">
            ⟳ &nbsp; SCAN AGAIN
        </button>

    </div>


    <div class="footer">
        🛡 Multi-layer AI Protection Active
    </div>

</div>


<script src="popup.js"></script>

</body>
</html>
